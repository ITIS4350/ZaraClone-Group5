<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZARA Official Website</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/zara_landing.css">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="site-header">

    <!-- Left Section: Menu & Brand Logo -->
    <div class="header-brand">
      <button id="menu-btn" class="menu-button" aria-label="Open Menu" aria-controls="mobile-menu" aria-expanded="false">
        <svg class="menu-icon" fill="none" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>

      <a href="#" class="zara-logo">
        ZARA
      </a>
    </div>

    <!-- Center Section: Search Bar (Desktop) -->
    <div class="header-search">
      <div class="search-field">
        <input
          type="text"
          placeholder="Search" aria-label="Search"
          class="search-input"
        />
      </div>
    </div>

    <!-- Right Section: Links & Dark Mode Toggle -->
    <div class="header-actions">
      <div class="header-links">
        <a href="#" class="header-link">Settings</a>
        <a href="#" class="header-link">Help</a>
        <a href="#" class="header-link">Bag</a>
      </div>

      <!-- Mobile Search Icon -->
      <button class="mobile-action" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- Mobile Bag Icon -->
      <a href="#" class="mobile-action" aria-label="Shopping Bag">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>

      <!-- Theme Switcher Switch -->
      <button
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle dark mode" aria-pressed="false"
      >
        <span class="theme-toggle-thumb">
          <i class="fa-regular fa-moon theme-icon-light"></i>
          <i class="fa-solid fa-moon theme-icon-dark"></i>
        </span>
      </button>
    </div>
  </header>

  <!-- Mobile Navigation Drawer Overlay -->
  <div id="mobile-menu" class="menu-overlay" aria-hidden="true" inert>
    <div class="menu-drawer" role="dialog" aria-modal="true" aria-label="Navigation menu">
      <div>
        <div class="menu-heading">
          <span class="zara-logo drawer-logo">ZARA</span>
          <button id="close-menu-btn" class="menu-close" aria-label="Close menu">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <nav class="menu-navigation">
          <a href="#" class="menu-link">New</a>
          <a href="#" class="menu-link">Woman</a>
          <a href="#" class="menu-link">Man</a>
          <a href="#" class="menu-link">Kids</a>
          <a href="#" class="menu-link">Beauty</a>
          <a href="#" class="menu-link">Collections</a>
        </nav>
      </div>

      <div class="menu-footer">
        <a href="#">Settings</a>
        <a href="#">Help &amp; Support</a>
        <a href="#">Shopping Bag (0)</a>
      </div>
    </div>
  </div>

  <!-- Hero Banner Main Container -->
  <main class="landing-main">

    <!-- Hero Box with Editorial Image -->
    <div class="hero">

      <!-- High Fashion Photography -->
      <img
        src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1920&auto=format&fit=crop"
        alt="ZARA New Collection Editorial Fashion"
        class="hero-image"
      />

      <!-- Dark Gradient Overlay for readability -->
      <div class="hero-gradient"></div>

      <!-- Left Bottom CTA Overlay Button -->
      <div class="hero-action">
        <a
          href="#"
          class="hero-cta"
        >
          Shop New Arrivals
        </a>
      </div>

      <!-- Bottom Carousel Dots Indicators -->
      <div class="carousel-indicators">
        <button class="carousel-dot" aria-label="Slide 1"></button>
        <button class="carousel-dot" aria-label="Slide 2"></button>
        <button class="carousel-dot is-active" aria-label="Slide 3 Active"></button>
        <button class="carousel-dot" aria-label="Slide 4"></button>
        <button class="carousel-dot" aria-label="Slide 5"></button>
        <button class="carousel-dot" aria-label="Slide 6"></button>
      </div>

      <!-- Bottom Down Arrow Scroll Icon -->
      <a
        href="#next-section"
        class="scroll-down"
        aria-label="Scroll Down"
      >
        <i class="fa-solid fa-arrow-down"></i>
      </a>

    </div>
  </main>

  <!-- Secondary Content Section (For smooth scrolling target) -->
  <section id="next-section" class="collection-section">
    <p class="collection-eyebrow">Autumn / Winter Collection</p>
    <h2 class="collection-title">Editorial Essentials</h2>
  </section>

  <script src="Interactivity.js"></script>

</body>
</html>
