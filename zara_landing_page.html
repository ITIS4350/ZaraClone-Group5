<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZARA Official Website</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Didot', 'Bodoni MT', 'Cinzel', 'Georgia', 'serif'],
            sans: ['Inter', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header / Navigation Bar -->
  <header class="w-full px-4 md:px-8 py-5 flex items-center justify-between border-b border-transparent sticky top-0 bg-white/90 dark:bg-neutral-900/90 backdrop-blur-md z-50">
    
    <!-- Left Section: Menu & Brand Logo -->
    <div class="flex items-center space-x-4 md:space-x-6">
      <button id="menu-btn" aria-label="Open Menu" class="p-1 focus:outline-none hover:opacity-70 transition-opacity">
        <svg class="w-7 h-7 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5" />
        </svg>
      </button>

      <a href="#" class="zara-logo text-3xl md:text-5xl tracking-tighter uppercase select-none leading-none">
        ZARA
      </a>
    </div>

    <!-- Center Section: Search Bar (Desktop) -->
    <div class="hidden md:flex flex-1 max-w-xs mx-8 items-center justify-center">
      <div class="relative w-full">
        <input 
          type="text" 
          placeholder="Search" 
          class="custom-underline-input w-full text-xs py-1 px-0 placeholder-neutral-500 dark:placeholder-neutral-400 focus:placeholder-transparent transition-all uppercase tracking-widest"
        />
      </div>
    </div>

    <!-- Right Section: Links & Dark Mode Toggle -->
    <div class="flex items-center space-x-4 md:space-x-8 text-xs font-normal tracking-wide">
      <div class="hidden md:flex items-center space-x-6">
        <a href="#" class="hover:underline tracking-wider uppercase">Settings</a>
        <a href="#" class="hover:underline tracking-wider uppercase">Help</a>
        <a href="#" class="hover:underline tracking-wider uppercase">Bag</a>
      </div>

      <!-- Mobile Search Icon -->
      <button class="md:hidden p-1 text-lg hover:opacity-70" aria-label="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- Mobile Bag Icon -->
      <a href="#" class="md:hidden p-1 text-lg hover:opacity-70" aria-label="Shopping Bag">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>

      <!-- Theme Switcher Switch -->
      <button 
        id="theme-toggle" 
        class="w-12 h-6 bg-neutral-200 dark:bg-neutral-700 rounded-full p-0.5 flex items-center justify-start dark:justify-end transition-all duration-300 border border-neutral-300 dark:border-neutral-600 focus:outline-none"
        aria-label="Toggle Theme"
      >
        <span class="w-5 h-5 bg-white dark:bg-neutral-900 rounded-full shadow-md flex items-center justify-center text-xs text-neutral-800 dark:text-neutral-200">
          <i class="fa-regular fa-moon dark:hidden"></i>
          <i class="fa-solid fa-moon hidden dark:block"></i>
        </span>
      </button>
    </div>
  </header>

  <!-- Mobile Navigation Drawer Overlay -->
  <div id="mobile-menu" class="fixed inset-0 bg-black/50 z-50 hidden opacity-0 transition-opacity duration-300">
    <div class="w-4/5 max-w-sm bg-white dark:bg-neutral-900 h-full p-8 flex flex-col justify-between shadow-2xl transform -translate-x-full transition-transform duration-300">
      <div>
        <div class="flex justify-between items-center mb-10">
          <span class="zara-logo text-3xl font-bold">ZARA</span>
          <button id="close-menu-btn" class="p-2 text-xl">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <nav class="flex flex-col space-y-6 text-sm uppercase tracking-widest font-light">
          <a href="#" class="hover:font-semibold">New</a>
          <a href="#" class="hover:font-semibold">Woman</a>
          <a href="#" class="hover:font-semibold">Man</a>
          <a href="#" class="hover:font-semibold">Kids</a>
          <a href="#" class="hover:font-semibold">Beauty</a>
          <a href="#" class="hover:font-semibold">Collections</a>
        </nav>
      </div>

      <div class="pt-6 border-t border-neutral-200 dark:border-neutral-800 flex flex-col space-y-3 text-xs uppercase tracking-wider text-neutral-600 dark:text-neutral-400">
        <a href="#">Settings</a>
        <a href="#">Help & Support</a>
        <a href="#">Shopping Bag (0)</a>
      </div>
    </div>
  </div>

  <!-- Hero Banner Main Container -->
  <main class="flex-1 relative w-full px-4 md:px-8 pb-6 max-w-[1800px] mx-auto flex flex-col">
    
    <!-- Hero Box with Editorial Image -->
    <div class="relative w-full flex-1 rounded-sm overflow-hidden bg-neutral-200 dark:bg-neutral-800 min-h-[70vh] md:min-h-[82vh] flex items-center justify-center">
      
      <!-- High Fashion Photography -->
      <img 
        src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1920&auto=format&fit=crop" 
        alt="ZARA New Collection Editorial Fashion" 
        class="absolute inset-0 w-full h-full object-cover object-center grayscale contrast-125 brightness-95"
      />

      <!-- Dark Gradient Overlay for readability -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>

      <!-- Left Bottom CTA Overlay Button -->
      <div class="absolute bottom-10 left-6 md:bottom-16 md:left-14 z-20">
        <a 
          href="#" 
          class="inline-block bg-black text-white hover:bg-neutral-900 dark:bg-black dark:text-white border border-neutral-800 px-6 py-4 md:px-9 md:py-5 text-sm md:text-base font-serif tracking-wide shadow-2xl transition-transform duration-200 hover:scale-[1.02]"
        >
          Shop New Arrivals
        </a>
      </div>

      <!-- Bottom Carousel Dots Indicators -->
      <div class="absolute bottom-12 md:bottom-12 left-1/2 -translate-x-1/2 z-20 flex items-center space-x-2.5">
        <button class="w-2.5 h-2.5 rounded-full bg-white/60 hover:bg-white transition-all" aria-label="Slide 1"></button>
        <button class="w-2.5 h-2.5 rounded-full bg-white/60 hover:bg-white transition-all" aria-label="Slide 2"></button>
        <button class="w-2.5 h-2.5 rounded-full bg-black ring-2 ring-white transition-all" aria-label="Slide 3 Active"></button>
        <button class="w-2.5 h-2.5 rounded-full bg-white/60 hover:bg-white transition-all" aria-label="Slide 4"></button>
        <button class="w-2.5 h-2.5 rounded-full bg-white/60 hover:bg-white transition-all" aria-label="Slide 5"></button>
        <button class="w-2.5 h-2.5 rounded-full bg-white/60 hover:bg-white transition-all" aria-label="Slide 6"></button>
      </div>

      <!-- Bottom Down Arrow Scroll Icon -->
      <a 
        href="#next-section" 
        class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 w-7 h-7 md:w-8 md:h-8 rounded-full border border-black/70 bg-white/80 dark:bg-black/80 dark:border-white/70 text-black dark:text-white flex items-center justify-center text-xs hover:scale-110 transition-transform shadow-md"
        aria-label="Scroll Down"
      >
        <i class="fa-solid fa-arrow-down"></i>
      </a>

    </div>
  </main>

  <!-- Secondary Content Section (For smooth scrolling target) -->
  <section id="next-section" class="px-4 md:px-8 py-12 max-w-[1800px] mx-auto w-full border-t border-neutral-200 dark:border-neutral-800 text-center">
    <p class="text-xs uppercase tracking-[0.3em] text-neutral-500 dark:text-neutral-400 mb-2">Autumn / Winter Collection</p>
    <h2 class="text-2xl md:text-4xl font-serif tracking-tight">Editorial Essentials</h2>
  </section>

  <script src="Interactivity.js"></script>

</body>
</html>
