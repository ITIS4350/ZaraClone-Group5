<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZARA Official Website</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/zara_landing.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
  <div id="site-header-placeholder"></div>

  <!-- Hero Banner Main Container -->
  <main class="landing-main">

    <!-- Hero Box with Editorial Image -->
    <div class="hero">

      <!-- High Fashion Photography -->
      <img
        src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1920&auto=format&fit=crop"
        alt="ZARA New Collection Editorial Fashion"
        class="hero-image"
        data-carousel-image
      />
      <img src="assets/data-carousel-image/fashion-model-background-data-carousel-image1.jpg" alt="Fashion editorial from the new collection" class="hero-image" data-carousel-image hidden />
      <img src="assets/data-carousel-image/fashion-model-background-data-carousel-image2.webp" alt="Fashion editorial from the new collection" class="hero-image" data-carousel-image hidden />
      <img src="assets/data-carousel-image/fashion-model-background-data-carousel-image3.webp" alt="Fashion editorial from the new collection" class="hero-image" data-carousel-image hidden />
      <img src="assets/data-carousel-image/fashion-model-background-data-carousel-image5.webp" alt="Fashion editorial from the new collection" class="hero-image" data-carousel-image hidden />

      <!-- Dark Gradient Overlay for readability -->
      <div class="hero-gradient"></div>

      <!-- Left Bottom CTA Overlay Button -->
      <div class="hero-action">
        <a
          href="new_arrivals.html"
          class="hero-cta"
        >
          Shop New Arrivals
        </a>
      </div>

      <!-- Carousel Dots -->
      <div class="carousel-controls" aria-label="Featured images">
        <button class="carousel-arrow carousel-previous" type="button" aria-label="Previous image">‹</button>
        <div class="carousel-indicators" aria-label="Choose a featured image"></div>
        <button class="carousel-arrow carousel-next" type="button" aria-label="Next image">›</button>
      </div>

    </div>
  </main>
  <!-- Secondary Content Section (For smooth scrolling target) -->
  <section id="next-section" class="collection-section">
    <p class="collection-eyebrow">Autumn / Winter Collection</p>
    <h2 class="collection-title">Editorial Essentials</h2>
    <div class="home-products-heading">
      <h3>New Arrivals</h3>
      <div class="home-product-controls">
        <button type="button" class="home-product-previous" aria-label="Scroll products left">‹</button>
        <button type="button" class="home-product-next" aria-label="Scroll products right">›</button>
      </div>
    </div>
    <div class="home-product-carousel" aria-label="New arrival products" tabindex="0"></div>
    <a class="home-view-all" href="new_arrivals.html">View all new arrivals</a>
  </section>

  <script src="js/header.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/Interactivity.js"></script>

  <script src="js/products.js"></script>
  <script src="js/search.js"></script>
  <script src="js/home.js"></script>

  <!-- Footer -->
   <footer class="site-footer">
    <div>
      <a href="help/index.html">Help</a>
      <a href="https://instagram.com">Social Media</a>
      <a href="#">Back to Top</a>
    </div>
  </footer>
</body>
</html>
