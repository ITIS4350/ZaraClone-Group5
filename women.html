<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeans | ZARA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body data-collection="women">
  <div id="site-header-placeholder"></div>
  <main class="collection-main">
    <section class="collection-heading" aria-labelledby="collection-title">
      <div>
        <p class="collection-breadcrumb"><a href="women.html">Woman</a> / Jeans</p>
        <h1 id="collection-title">Jeans</h1>
        <p class="collection-description">Essential silhouettes, considered washes, and a fit for every day.</p>
      </div>
      <div class="collection-tools">
        <p id="collection-count" aria-live="polite">9 items</p>
        <label class="collection-sort" for="collection-sort">Sort by
          <span class="sort-field">
            <select id="collection-sort">
              <option value="featured">Featured</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
              <option value="name">Name: A to Z</option>
            </select>
          </span>
        </label>
      </div>
    </section>
    <section id="collection-grid" class="collection-grid" aria-label="Jeans products"></section>
    <noscript><p>Enable JavaScript to browse the collection.</p></noscript>
    <template id="catalog-card-template">
      <article class="catalog-card">
        <a class="catalog-photo">
          <img class="catalog-image" alt="" hidden>
          <span class="catalog-placeholder">Image coming soon</span>
          <span class="catalog-badge" hidden></span>
        </a>
        <div class="catalog-details">
          <h2><a class="catalog-name"></a></h2>
          <p class="catalog-color"></p>
          <p class="catalog-price"></p>
          <button class="catalog-add" type="button"><span aria-hidden="true">+</span></button>
        </div>
      </article>
    </template>
  </main>
  <dialog id="quick-add" class="quick-add" aria-labelledby="quick-add-title">
    <div class="quick-add-heading">
      <h2 id="quick-add-title">Add to Bag</h2>
      <button class="quick-add-close" type="button" aria-label="Close size and color picker">&times;</button>
    </div>
    <form id="quick-add-form">
      <p id="quick-add-price"></p>
      <label for="quick-add-color">Color<select id="quick-add-color" name="color" required></select></label>
      <label for="quick-add-size">Size<select id="quick-add-size" name="size" required></select></label>
      <button class="quick-add-submit" type="submit">Add to Bag</button>
      <p id="quick-add-message" class="quick-add-message" role="status"></p>
      <a class="quick-add-bag-link" href="bag_page.html">View Bag</a>
    </form>
  </dialog>
  <p id="collection-status" class="collection-status" role="status" aria-live="polite"></p>
  <script src="js/header.js"></script>
  <script src="js/Interactivity.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/collection.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
